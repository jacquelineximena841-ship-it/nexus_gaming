<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NEXUS Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#06060c] text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#101020] border border-purple-500/40 p-8 rounded-2xl max-w-md w-full shadow-2xl shadow-purple-500/10">
        <h2 class="text-2xl font-bold text-center text-purple-400 mb-6 uppercase tracking-wider">Acceso Nexus</h2>
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Correo Electrónico</label>
                <input type="email" name="correo" required class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-slate-700 focus:border-purple-400 outline-none">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-slate-700 focus:border-purple-400 outline-none">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold uppercase tracking-wider hover:opacity-90 transition-all">
                Entrar
            </button>
        </form>
        <div class="mt-6 text-center text-sm text-slate-400 space-y-2">
            <p>¿No tienes cuenta? <a href="/register.html" class="text-purple-400 hover:underline">Regístrate aquí</a></p>
            <p><a href="/" class="text-slate-500 hover:text-white">← Volver a la página principal</a></p>
        </div>
    </div>
</body>
</html>
